name: Make a wish
description: Hoshi started as a wish list. Add yours.
title: "Wish: "
labels: ["wish"]
body:
  - type: markdown
    attributes:
      value: |
        Hoshi began as a list of things I wished a phone terminal could do. If something is missing from yours, write it down here.
  - type: textarea
    id: wish
    attributes:
      label: I wish Hoshi could...
      description: What you want, in your own words.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to me
      description: What you were doing when you missed it, and what you do today instead.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How I picture it
      description: Optional. A sketch, a screenshot from another app, or how it might work.
  - type: checkboxes
    id: help
    attributes:
      label: Want to help grant it?
      options:
        - label: I'd like to work on this myself (see CONTRIBUTING.md)
