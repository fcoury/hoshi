name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build and security tools
        run: brew install xcodegen zig@0.15 ripgrep gitleaks

      - name: Install Metal shader toolchain when required
        run: |
          if ! xcrun --sdk iphoneos metal -v >/dev/null 2>&1; then
            metal_build="$(
              xcodebuild -showComponent MetalToolchain -json \
                | plutil -extract buildVersion raw -
            )"
            xcodebuild -downloadComponent MetalToolchain -buildVersion "$metal_build"
          fi

      - name: Scan repository history for committed secrets
        run: gitleaks git --redact --no-banner --exit-code 1

      - name: Verify generated project is current
        run: |
          xcodegen --spec Hoshi/project.yml --project Hoshi
          git diff --exit-code -- Hoshi/Hoshi.xcodeproj/project.pbxproj

      - name: Test self-hosted agent companion
        run: python3 scripts/test-hoshi-agent-companion.py

      # GhosttyKit only changes when the vendored sources, the build scripts or
      # the toolchain change, so a cold Zig build on every run is wasted time.
      - name: Compute GhosttyKit cache key
        id: ghosttykit-key
        run: |
          ghostty_sha="$(git rev-parse HEAD:vendor/ghostty)"
          libxev_sha="$(git rev-parse HEAD:vendor/libxev)"
          zig_version="$("$(brew --prefix zig@0.15)/bin/zig" version)"
          xcode_build="$(xcodebuild -version | awk '/Build version/ { print $3 }')"
          scripts_hash="$(
            cat scripts/build-ghosttykit.sh scripts/ghostty-libtool.sh \
              | shasum -a 256 | cut -c1-16
          )"
          echo "key=ghosttykit-v1-${RUNNER_OS}-${RUNNER_ARCH}-xcode${xcode_build}-zig${zig_version}-${ghostty_sha}-${libxev_sha}-${scripts_hash}" >> "$GITHUB_OUTPUT"

      - name: Restore cached GhosttyKit
        id: ghosttykit-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.ghosttykit-key.outputs.key }}

      - name: Prepare GhosttyKit and regenerate the project
        env:
          HOSHI_GHOSTTYKIT_PREBUILT: ${{ steps.ghosttykit-cache.outputs.cache-hit == 'true' }}
        run: ./scripts/bootstrap.sh

      # Save right after a fresh build so a later test failure still reuses it.
      - name: Save GhosttyKit to the cache
        if: steps.ghosttykit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          key: ${{ steps.ghosttykit-key.outputs.key }}

      - name: Build and run unit tests
        run: |
          simulator_id="$(
            xcrun simctl list devices available \
              | sed -nE 's/^[[:space:]]+iPhone[^()]*\(([A-Fa-f0-9-]+)\).*/\1/p' \
              | head -n 1
          )"
          if [[ -z "$simulator_id" ]]; then
            echo "error: no available iPhone simulator was found" >&2
            exit 1
          fi

          xcodebuild test \
            -project Hoshi/Hoshi.xcodeproj \
            -scheme Hoshi \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO
