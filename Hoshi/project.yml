name: Hoshi
options:
  bundleIdPrefix: com.hoshi
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.12.0"
  CryptoSwift:
    url: https://github.com/krzyzanowskim/CryptoSwift.git
    from: "1.8.0"

targets:
  Hoshi:
    type: application
    platform: iOS
    sources:
      - Hoshi
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_CFBundleDisplayName: "Hoshi"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        "INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad": UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Preserve the existing release declaration; review export compliance before shipping.
        ITSAppUsesNonExemptEncryption: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: app.gethoshi.ios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: UXWHD5F6F4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Citadel
      - package: CryptoSwift
      - framework: Frameworks/GhosttyKit.xcframework
        embed: false

  HoshiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HoshiTests
    dependencies:
      - target: Hoshi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.hoshi.HoshiTests
        TARGETED_DEVICE_FAMILY: "1,2"
