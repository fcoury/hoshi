# Calm status bar that reads well on a phone screen.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g base-index 1
set -g escape-time 0
set -g allow-passthrough on
set -g status-position bottom
set -g status-style "bg=#1f2633,fg=#9aa5b8"
set -g status-left "#[bg=#3878ff,fg=#ffffff,bold] #S #[default] "
set -g status-left-length 20
set -g status-right ""
set -g window-status-format " #I #W "
set -g window-status-current-format "#[fg=#e8c66b,bold] #I #W "
set -g pane-border-style "fg=#2d3546"
set -g pane-active-border-style "fg=#3878ff"
set -g message-style "bg=#1f2633,fg=#e8c66b"
set -g allow-rename off
setw -g automatic-rename off
